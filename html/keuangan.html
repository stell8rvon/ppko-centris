<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>KaWis - KO AWIS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../assets/logo-koawis-brand.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <script src="../js/include-navbar.js"></script>

    <main style="max-width:1000px; margin: 8rem auto 4rem; padding: 0 1.5rem; min-height: 60vh;">
        
        <!-- Header KaWis -->
        <div style="text-align: center; margin-bottom: 3rem;">
            <span style="display:inline-block; padding:0.4rem 1rem; background:var(--brown-100); color:var(--brown-700); border-radius:50px; font-size:0.8rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:1rem;">Transparansi</span>
            <h1 style="font-family:'Poppins', sans-serif; font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; color: var(--brown-900); margin-bottom: 0.5rem;">Data KaWis</h1>
            <p style="color: var(--text-mid); font-size: 1.05rem;">Rekapitulasi sirkulasi kas dan pendanaan program PPK Ormawa.</p>
            
            <!-- TOMBOL DOWNLOAD EXCEL -->
            <div style="margin-top: 1.5rem;">
                <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vQeJz2sQsM6hQKMxZMKcvxM9i38XSjbrPoXJOo-wE4Mzu3YhNXsyEM1JFpX_Y8vn1GLzAPsfTGzdpk_/pub?output=xlsx" target="_blank" class="btn-primary" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; padding: 0.85rem 2rem; border-radius: 8px; font-weight: 600;">
                    <i class="fas fa-file-excel"></i> Download File Excel
                </a>
            </div>
        </div>

        <!-- Wadah Excel (Iframe) untuk Tampilan Web -->
        <div style="background: var(--white); padding: 1rem; border-radius: 16px; border: 1px solid var(--cream-dark); box-shadow: var(--shadow-md); overflow: hidden;">
            <iframe 
                src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQeJz2sQsM6hQKMxZMKcvxM9i38XSjbrPoXJOo-wE4Mzu3YhNXsyEM1JFpX_Y8vn1GLzAPsfTGzdpk_/pubhtml?widget=true&amp;headers=false&amp;chrome=false" 
                width="100%" 
                height="700px" 
                style="border: none; border-radius: 8px;">
            </iframe>
        </div>

    </main>

    <!-- Footer -->
    <script src="../js/include-footer.js"></script>
</body>
</html>
