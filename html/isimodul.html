<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Modul KO AWIS</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../assets/logo-koawis-brand.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <script src="../js/include-navbar.js"></script>

    <main class="page-isimodul" style="max-width:900px; margin: 8rem auto 4rem; padding:0 1.5rem; min-height: 60vh;">
        
        <div class="breadcrumb" style="display:flex; gap:0.5rem; font-size:0.85rem; color:var(--text-light); margin-bottom:2rem; align-items:center;">
            <a href="index.html" style="cursor:pointer;"><i class="fas fa-home"></i> Beranda</a>
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            <a href="modul.html">Program KO AWIS</a>
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            <a href="modullist.html" id="breadcrumbTrack" style="font-weight: 600; color: var(--brown-600);">Daftar Modul</a>
        </div>

        <div class="modul-content" id="modulContent" style="background: var(--white); padding: 3rem; border-radius: var(--radius-lg); border: 1px solid var(--cream-dark); box-shadow: var(--shadow-sm);">
            <div style="text-align:center; padding: 4rem 0;">
                <i class="fas fa-circle-notch fa-spin" style="font-size:2rem; color:var(--brown-500); margin-bottom:1rem;"></i>
                <p>Memuat materi...</p>
            </div>
        </div>

        <div style="margin-top: 2rem; text-align:center;">
            <button onclick="history.back()" style="background:var(--brown-100); color:var(--brown-800); border:1px solid var(--brown-300); padding:10px 24px; border-radius:8px; cursor:pointer; font-weight:600; font-family:'Poppins', sans-serif; transition:all 0.3s ease;">
                <i class="fas fa-arrow-left"></i> Kembali ke Daftar Modul
            </button>
        </div>
    </main>

    <script src="../js/include-footer.js"></script>
    <script src="../js/supabase-client.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(location.search);
            const modulId = params.get('id');

            if (modulId) {
                try {
                    const { data: modul, error } = await supabase.from('modules').select(`*, tracks ( title, slug )`).eq('id', modulId).single();
                    if (error) throw error;
                    
                    if (modul) {
                        document.title = modul.title + " - KO AWIS";
                        
                        const breadcrumbTrack = document.getElementById('breadcrumbTrack');
                        breadcrumbTrack.href = `modullist.html?track=${modul.tracks.slug}`;
                        breadcrumbTrack.textContent = modul.tracks.title;

                        // PROSES PEMBERSIHAN KODE AJAIB (Super Aman!)
                        let processedContent = modul.content || '';
                        
                        processedContent = processedContent.replace(/\[PDF\]([\s\S]*?)\[\/PDF\]/gi, (match, url) => {
                            let cleanUrl = url.replace(/<[^>]*>?/gm, '').replace(/&nbsp;/gi, '').trim();
                            return `<iframe src="${cleanUrl}" width="100%" height="800px" style="border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 1rem; margin-bottom: 2rem;"></iframe>`;
                        });

                        processedContent = processedContent.replace(/\[TOMBOL=([^\]]+)\]([\s\S]*?)\[\/TOMBOL\]/gi, (match, url, label) => {
                            let cleanUrl = url.replace(/<[^>]*>?/gm, '').replace(/&nbsp;/gi, '').trim();
                            let cleanLabel = label.replace(/<[^>]*>?/gm, '').replace(/&nbsp;/gi, '').trim();
                            return `<a href="${cleanUrl}" target="_blank" class="btn-primary" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; margin-top: 1rem; margin-bottom: 1rem;"><i class="fas fa-cloud-download-alt"></i> ${cleanLabel}</a>`;
                        });

                        // TAMPILKAN KE LAYAR
                        document.getElementById('modulContent').innerHTML = `
                            <span style="background:var(--brown-800); color:white; padding:4px 12px; border-radius:50px; font-size:0.75rem; font-weight:bold; text-transform:uppercase; display:inline-block; margin-bottom:1rem;">
                                ${modul.tracks.title}
                            </span>
                            <h1 style="font-family: 'Poppins', sans-serif; font-size: 2.2rem; font-weight: 800; color: var(--brown-900); line-height: 1.3; margin-bottom: 1rem;">${modul.title}</h1>
                            <p style="font-size: 1.05rem; color: var(--text-light); margin-bottom: 2rem; border-bottom: 1px solid var(--cream-dark); padding-bottom: 1.5rem;">${modul.description || ''}</p>
                            
                            <div style="margin-top: 2rem; font-size: 1.05rem; line-height: 1.8; color: var(--text-mid);">
                                ${processedContent}
                            </div>
                        `;
                    }
                } catch (e) {
                    document.getElementById('modulContent').innerHTML = "<p style='text-align:center; color:red;'>Gagal memuat materi.</p>";
                }
            } else {
                document.getElementById('modulContent').innerHTML = "<p style='text-align:center;'>Modul tidak ditemukan.</p>";
            }
        });
    </script>
</body>
</html>
